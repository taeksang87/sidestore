name: CommuteTimer
options:
  bundleIdPrefix: app.commutetimer
  deploymentTarget:
    iOS: "16.0"
targets:
  CommuteTimer:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    scheme: {}
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 출퇴근
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.commutetimer.CommuteTimer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
