name: CommuteTimer
options:
  bundleIdPrefix: app.commutetimer
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGNING_ALLOWED: NO
targets:
  CommuteTimer:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
      - Resources
    dependencies:
      - target: CommuteWidget
    scheme: {}
    info:
      path: Info.plist
      properties:
        # SideStore가 이 이름으로 Apple App ID를 만들기 때문에 영문·숫자만 쓴다 (홈 화면 이름은 ko.lproj)
        CFBundleDisplayName: CommuteTimer
        CFBundleName: CommuteTimer
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations:
          - ko
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "2"
        LSRequiresIPhoneOS: true
        NSSupportsLiveActivities: true
        # 잠금화면 실시간 현황을 눌렀을 때 commutetimer://korail 로 앱이 열린다
        CFBundleURLTypes:
          - CFBundleURLName: app.commutetimer
            CFBundleURLSchemes:
              - commutetimer
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.commutetimer.CommuteTimer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  CommuteWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: WidgetInfo.plist
      properties:
        CFBundleDisplayName: CommuteWidget
        CFBundleName: CommuteWidget
        CFBundleDevelopmentRegion: ko
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "2"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.commutetimer.CommuteTimer.widget
        SKIP_INSTALL: YES
