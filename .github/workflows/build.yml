name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project CommuteTimer.xcodeproj \
            -scheme CommuteTimer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || true
          grep -E "BUILD (SUCCEEDED|FAILED)" build.log || true
          grep -q "BUILD SUCCEEDED" build.log

      # 공개 API로도 볼 수 있도록 컴파일 오류를 주석(annotation)으로 남긴다.
      - name: Report compile errors
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -30 | while IFS= read -r line; do
            echo "::error::${line#$GITHUB_WORKSPACE/}"
          done

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/CommuteTimer.app Payload/
          # SideStore는 앱 이름으로 Apple App ID를 만들기 때문에 영문·숫자만 허용된다.
          for key in CFBundleDisplayName CFBundleName; do
            name=$(/usr/libexec/PlistBuddy -c "Print :$key" Payload/CommuteTimer.app/Info.plist)
            echo "$key=$name"
            echo "$name" | grep -qE '^[A-Za-z0-9 ]+$' || { echo "::error::$key '$name' 에 영문·숫자 외 문자가 있음"; exit 1; }
          done
          test -f Payload/CommuteTimer.app/ko.lproj/InfoPlist.strings || { echo "::error::ko.lproj/InfoPlist.strings 누락"; exit 1; }
          zip -qry CommuteTimer.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CommuteTimer-ipa
          path: CommuteTimer.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 출퇴근 시간표 (빌드 ${{ github.run_number }})
          body: 아이폰 Safari에서 아래 CommuteTimer.ipa를 받아 SideStore로 설치하세요.
          files: CommuteTimer.ipa
