name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project CommuteTimer.xcodeproj \
            -scheme CommuteTimer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/CommuteTimer.app Payload/
          zip -qry CommuteTimer.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CommuteTimer-ipa
          path: CommuteTimer.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 출퇴근 시간표 (빌드 ${{ github.run_number }})
          body: 아이폰 Safari에서 아래 CommuteTimer.ipa를 받아 SideStore로 설치하세요.
          files: CommuteTimer.ipa
